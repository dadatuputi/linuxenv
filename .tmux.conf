# ~/.tmux.conf - shared tmux config from github.com/dadatuputi/linuxenv
# Needs tmux 3.2+ (Debian 13 ships 3.5a, Homebrew 3.8).

# --- Terminal and colour ----------------------------------------------------
set -g default-terminal "tmux-256color"
# True colour and italics when the outer terminal is an xterm (iTerm2 is).
set -as terminal-features ',xterm*:RGB'
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -g focus-events on
# Use the login shell rather than a hard-coded path (/usr/bin/zsh does not
# exist on macOS).
set -g default-command "${SHELL}"

# --- General ----------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on

# --- Key bindings -----------------------------------------------------------
# Shift+Left/Right moves the current window left or right.
bind-key -n S-Left swap-window -t -1\; select-window -t -1
bind-key -n S-Right swap-window -t +1\; select-window -t +1
# Split and new window open in the current directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
# prefix + r reloads this file.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Pane titles ------------------------------------------------------------
# https://stackoverflow.com/questions/9747952/pane-title-in-tmux
set -g pane-border-status bottom
set -g pane-border-format "#{pane_index} - #T (#{pane_current_command})"

# --- Plugins (TPM) ----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'erikw/tmux-powerline'

set -g @resurrect-capture-pane-contents 'on'
set -g @scroll-without-changing-pane 'on'
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# Install TPM on first start so a fresh box only needs this file.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone --depth=1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep this line at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
